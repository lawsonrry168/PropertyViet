<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R6W4VPTS19"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-R6W4VPTS19');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropertyViet - 香港人越南買樓血淚史</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Sans HK', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #eef0f2;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .brand-bar {
            background-color: #A31D1D;
            height: 6px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 16px 16px 0 0;
        }
        .container { position: relative; }
        h1 {
            font-size: 24px;
            color: #111111;
            margin-bottom: 15px;
            font-weight: 700;
            line-height: 1.4;
        }
        p.subtitle {
            font-size: 15px;
            color: #666666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #444444;
        }
        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="email"]:focus {
            border-color: #A31D1D;
        }
        button {
            width: 100%;
            background-color: #FFD700;
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
        }
        button:hover {
            background-color: #ffcc00;
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #e0e0e0;
            color: #888888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #999999;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-bar"></div>

        <h1>免費索取《越南買樓避坑清單》</h1>
        <p class="subtitle">凝聚多位香港業主血淚教訓，進場前必讀！<br>輸入電郵，系統將自動為您發送 PDF 指南。</p>

        <form id="leadForm" onsubmit="submitLeadForm(event)">
            <div class="form-group">
                <label for="emailInput">電子信箱地址</label>
                <input type="email" id="emailInput" placeholder="example@gmail.com" required>
            </div>
            <button type="submit" id="submitBtn">立即免費索取 PDF</button>
        </form>

        <p class="footer-text">我們承諾保護您的隱私，您可以隨時取消訂閱。<br>本郵件內容僅供參考，不構成任何投資建議。</p>
    </div>

    <script>
    async function submitLeadForm(event) {
        event.preventDefault(); // 阻止網頁刷新的預設行為

        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const emailValue = emailInput.value.trim();

        if (!emailValue) return;

        // 鎖定按鈕，防止用戶重複點擊導致多次發信
        submitBtn.disabled = true;
        submitBtn.innerText = '正在處理並發送郵件...';

        try {
            // 呼叫 Vercel 自動生成的後端接口 /api/send
            const response = await fetch('/api/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: emailValue })
            });

            const result = await response.json();

            if (response.ok) {
                // 發送成功提示
                alert('🎉 索取成功！《越南買樓避坑清單 .PDF》已發送到您的信箱，請立刻查收（若沒看到，請檢查垃圾郵件匣）。');
                emailInput.value = ''; // 清空輸入框
            } else {
                console.error('後端發送失敗:', result.error);
                alert('❌ 發送失敗，請確保輸入了正確的電郵，或稍後再試。');
            }

        } catch (error) {
            console.error('網路連線錯誤:', error);
            alert('❌ 系統連線失敗，請檢查網絡或稍後再試。');
        } finally {
            // 解鎖按鈕，恢復狀態
            submitBtn.disabled = false;
            submitBtn.innerText = '立即免費索取 PDF';
        }
    }
    </script>

</body>
</html>
